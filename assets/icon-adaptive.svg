<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .bg-rect {
        fill: #FFFFFF;
        transition: fill 0.3s ease;
      }
      .bubble-fill {
        fill: url(#buddyGradLight);
      }
      .inner-dot {
        fill: #FFFFFF;
      }
      @media (prefers-color-scheme: dark) {
        .bg-rect {
          fill: #090A11;
        }
        .bubble-fill {
          fill: url(#buddyGradDark);
        }
        .inner-dot {
          fill: #090A11;
        }
      }
    </style>
    <linearGradient id="buddyGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E7E" />
      <stop offset="100%" stop-color="#FF6584" />
    </linearGradient>
    <linearGradient id="buddyGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E7E" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FF2E7E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dynamic Theme Background (Light / Dark) -->
  <rect class="bg-rect" width="512" height="512" rx="128" />

  <!-- Chat Bubble Silhouette -->
  <g filter="url(#glow)">
    <path class="bubble-fill" d="M256 64 C150 64 64 150 64 256 C64 292 74 326 91 355 L64 448 L161 422 C189 439 221 448 256 448 C362 448 448 362 448 256 C448 150 362 64 256 64 Z" />
  </g>

  <!-- Modern Chat Indicator Dots -->
  <circle class="inner-dot" cx="196" cy="256" r="22" opacity="0.95" />
  <circle class="inner-dot" cx="256" cy="256" r="22" opacity="0.95" />
  <circle class="inner-dot" cx="316" cy="256" r="22" opacity="0.95" />
</svg>

